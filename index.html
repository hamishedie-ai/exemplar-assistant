<script>

/* ---------- voice: record, then Gemini writes it out ---------- */
// Newest, fastest models first. Google now limits the older 2.5 models for newer keys, which made them very slow.
const GEMINI_MODELS = ["gemini-3.5-flash-lite", "gemini-3.8-flash", "gemini-2.5-flash-lite", "gemini-flash-latest"];
const getKey = () => { try { return localStorage.getItem("geminiKey") || ""; } catch (e) { return ""; } };
let mediaRec = null, chunks = [], micStream = null, recTimer = null, busyVoice = false;
$("saveKey").onclick = () => {

  try { localStorage.setItem("geminiKey", k); } catch (e) { return msg("Couldn't save the key on this phone.", true); }
  $("keyIn").value = ""; $("keyCard").classList.add("hide"); msg("Key saved. Tap the mic and talk."); keyWarn();
};
function keyWarn() { $("keyWarn").classList.toggle("hide", !!getKey()); }
function askKey() {
  const k = getKey();
  $("keyTitle").textContent = k ? "Your Gemini key" : "You have no Gemini key entered";
  $("keyState").textContent = k ? "A key is saved on this phone (ends in " + k.slice(-4) + "). Paste a new one below to replace it." : "";

$("keyRemove").onclick = () => { try { localStorage.removeItem("geminiKey"); } catch (e) {} $("keyCard").classList.add("hide"); keyWarn(); msg("Key removed."); };
$("keyWarn").onclick = askKey;
$("mic").onclick = () => {
  if (busyVoice) return;
  if (!getKey()) { askKey(); msg("You have no Gemini key entered.", true); return; }
  mediaRec && mediaRec.state === "recording" ? stopRec() : startRec();
};
async function startRec() {
  if (!navigator.mediaDevices || !window.MediaRecorder) return msg("Recording isn't available here. Tap the text box and use the keyboard's microphone key.", true);
  try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { return msg("Microphone blocked. Allow it in Settings, or use the keyboard's microphone key.", true); }
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  chunks = [];
  mediaRec = new MediaRecorder(micStream, type ? { mimeType: type } : undefined);
  mediaRec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mediaRec.onstop = () => transcribe(new Blob(chunks, { type: mediaRec.mimeType || type || "audio/mp4" }));
  mediaRec.start();
  setRec(true); msg("");
  recTimer = setTimeout(stopRec, 5 * 60 * 1000);
}
function stopRec() {
  clearTimeout(recTimer);
  if (mediaRec && mediaRec.state === "recording") mediaRec.stop();
  if (micStream) micStream.getTracks().forEach(t => t.stop());

const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
// Turns whatever the phone recorded into a small 16 kHz mono WAV, which Gemini reads reliably.
async function toWav(blob) {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  try {
    const ab = await blob.arrayBuffer();
    const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });
    const rate = 16000, len = Math.max(1, Math.round(buf.duration * rate));
    const off = new OfflineAudioContext(1, len, rate);
    const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
    const pcm = (await off.startRendering()).getChannelData(0);
    const out = new DataView(new ArrayBuffer(44 + pcm.length * 2));
    const w = (o, s) => { for (let k = 0; k < s.length; k++) out.setUint8(o + k, s.charCodeAt(k)); };
    w(0, "RIFF"); out.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVEfmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
    out.setUint32(24, rate, true); out.setUint32(28, rate * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); w(36, "data"); out.setUint32(40, pcm.length * 2, true);
    for (let k = 0; k < pcm.length; k++) out.setInt16(44 + k * 2, Math.max(-1, Math.min(1, pcm[k])) * 32767, true);

  } finally { ctx.close && ctx.close(); }
}
async function transcribe(blob) {
  if (!blob.size) return msg("Didn't catch any sound. Try again.", true);
  busyVoice = true; $("micHint").textContent = "Writing it out…"; $("mic").disabled = true;
  if (blob.size > 14 * 1048576) { busyVoice = false; $("mic").disabled = false; setRec(false); return msg("That recording is too long. Try shorter ones (a few minutes each).", true); }
  try {
    $("micHint").textContent = "Preparing the recording…";
    try { blob = await toWav(blob); } catch (e) { /* send it as recorded instead */ }
    const data = await toB64(blob);
    const mime = (blob.type || "audio/mp4").split(";")[0];
    const prompt = "Transcribe this audio exactly as spoken. The speaker is an Australian electrical apprentice describing their work day, so expect trade words (e.g. downlights, RCD, switchboard, conduit, PVC, TPS cable, terminate, isolate, LV, ELV, GPO, MCB, earth, neutral, active). Use Australian English spelling, add normal punctuation and paragraphs, and do not add, explain or summarise anything. Output only the transcript. If there is no speech, output nothing.";
    let text = null, lastErr = "";
    const mb = (blob.size / 1048576).toFixed(1);
    for (const m of GEMINI_MODELS) {
      let res;
      for (const thinkOff of [true, false]) {
        const ctl = new AbortController();
        const t0 = Date.now();
        const tick = setInterval(() => { $("micHint").textContent = `Writing it out… ${Math.round((Date.now() - t0) / 1000)}s (${mb} MB sent)`; }, 1000);
        const timer = setTimeout(() => ctl.abort(), window.VOICE_TIMEOUT_MS || 25000);
        try {
          res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {
            method: "POST",
            signal: ctl.signal,
            headers: { "Content-Type": "application/json", "x-goog-api-key": getKey() },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: mime, data } }] }], generationConfig: { temperature: 0, ...(thinkOff ? { thinkingConfig: { thinkingBudget: 0 } } : {}) } }),

        }

      if (res.status === 404) { lastErr = "model"; continue; }
      if (res.status === 429) { lastErr = "limit"; continue; }
      if (res.status >= 500) { lastErr = "busy"; continue; }

        let j = {}; try { j = await res.json(); } catch (e) {}
        const em = (j.error && j.error.message) || "";
        if (/API key/i.test(em) || res.status === 403) throw new Error("That Gemini key was refused. Tap Voice key below to paste it again.");
        lastErr = "bad: " + em.slice(0, 160); continue; // try the next model
      }
      if (!res.ok) throw new Error("Gemini didn't answer (error " + res.status + ").");
      const j = await res.json();
      text = ((j.candidates || [])[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
      break;
    }
    if (text === null) throw new Error(lastErr === "limit" ? "Gemini's free limit was hit. Wait a minute and try again." : lastErr === "model" ? "Couldn't find a Gemini model that works. Tap Voice key below and check your key." : lastErr === "slow" || lastErr === "busy" ? "Gemini is slow or busy right now. Try again in a minute." : "Gemini couldn't read the recording. " + lastErr.replace(/^bad: /, ""));
    if (!text) throw new Error("Didn't catch any speech. Try again, closer to the mic.");
    const cur = $("text").value.trim();
    $("text").value = cur ? cur + "\n\n" + text : text;
    msg("Added. Check it reads right, then Save day.");
  } catch (e) {
    msg(e.name === "TypeError" ? "No internet connection." : e.message, true);
    if (/refused/.test(e.message)) askKey();
  } finally {
    busyVoice = false; $("mic").disabled = false; setRec(false);
  }
}
function setRec(on) {
  $("mic").classList.toggle("rec", on);
  $("micHint").textContent = on ? "Recording… tap to stop" : "Tap and say what you did today";
}
$("keyLink").onclick = askKey;
$("keyCancel").onclick = () => $("keyCard").classList.add("hide");

/* ---------- photos ---------- */
$("photos").onchange = async e => {
  for (const f of e.target.files) {
    const blob = await shrink(f);
    pending.push({ blob, url: URL.createObjectURL(blob) });
  }
  e.target.value = "";
  renderThumbs();
};
const XSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function renderThumbs() {
  const box = $("thumbs"); box.innerHTML = "";
  const add = (url, label, fn) => {
    const w = document.createElement("div"); w.className = "th";
    const i = new Image(); i.src = url; i.alt = "Photo";
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", label); b.innerHTML = XSVG; b.onclick = fn;
    w.append(i, b); box.appendChild(w);
  };
  savedPh.forEach(p => add(p.url, "Delete this photo", () => deleteSaved(p)));
  pending.forEach(p => add(p.url, "Remove this photo", () => { pending = pending.filter(x => x !== p); renderThumbs(); }));
}
async function deleteSaved(p) {
  if (!confirm("Delete this photo? This can't be undone.")) return;
  msg("Deleting…");
  const r1 = await sb.storage.from("profiling-photos").remove([p.path]);
  if (r1.error) return msg("Couldn't delete: " + r1.error.message, true);
  const r2 = await sb.from("entry_photos").delete().eq("id", p.id);
  if (r2.error) return msg("Couldn't delete: " + r2.error.message, true);
  savedPh = savedPh.filter(x => x !== p); renderThumbs(); msg("Photo deleted.");
}
$("clear").onclick = async () => {
  if (busyVoice || (mediaRec && mediaRec.state === "recording")) return msg("Finish the recording first (tap the mic to stop).", true);
  const has = $("text").value.trim() || pending.length || savedId;
  if (!has) return msg("Nothing to clear.");
  const q = savedId ? "Clear this whole day? This deletes the saved entry and its photos, and can't be undone." : "Clear what you've typed and the photos you've added?";
  if (!confirm(q)) return;
  $("clear").disabled = true; msg("Clearing…");
  try {
    if (savedId) {
      const paths = savedPh.map(p => p.path);
      if (paths.length) { const r = await sb.storage.from("profiling-photos").remove(paths); if (r.error) throw r.error; }
      let r = await sb.from("entry_photos").delete().eq("entry_id", savedId); if (r.error) throw r.error;
      r = await sb.from("daily_entries").delete().eq("id", savedId); if (r.error) throw r.error;
    }
    $("text").value = ""; pending = []; savedPh = []; savedId = null; renderThumbs(); msg("Cleared ✓");
  } catch (e) { msg("Couldn't clear: " + e.message, true); }
  $("clear").disabled = false;
};
function shrink(file, max = 1600) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || file), "image/jpeg", 0.82);
    };
    img.onerror = () => res(file);
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- data ---------- */
async function loadDay() {
  pending = []; savedPh = []; savedId = null; renderThumbs(); msg("");
  const { data, error } = await sb.from("daily_entries").select("id, transcript, status").eq("entry_date", $("date").value).maybeSingle();
  if (error) return msg(error.message, true);
  $("text").value = data ? (data.transcript || "") : "";
  if (data) {
    savedId = data.id;
    const { data: ph } = await sb.from("entry_photos").select("id, storage_path").eq("entry_id", data.id);
    if (ph && ph.length) {
      const { data: urls } = await sb.storage.from("profiling-photos").createSignedUrls(ph.map(p => p.storage_path), 3600);
      savedPh = ph.map((p, k) => ({ id: p.id, path: p.storage_path, url: urls && urls[k] && urls[k].signedUrl })).filter(p => p.url);
    }
    renderThumbs();
  }
}

$("save").onclick = async () => {
  const text = $("text").value.trim(), day = $("date").value;
  if (!text && !pending.length) return msg("Nothing to save yet.", true);
  if (busyVoice || (mediaRec && mediaRec.state === "recording")) return msg("Finish the recording first (tap the mic to stop).", true);
  $("save").disabled = true; msg("Saving…");
  try {
    const { data: entry, error } = await sb.from("daily_entries")
      .upsert({ user_id: user.id, entry_date: day, transcript: text, status: "draft" }, { onConflict: "user_id,entry_date" })
      .select("id").single();
    if (error) throw error;
    for (const { blob } of pending) {
      const path = `${user.id}/${day}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
      const up = await sb.storage.from("profiling-photos").upload(path, blob, { contentType: "image/jpeg" });
      if (up.error) throw up.error;
      const ins = await sb.from("entry_photos").insert({ entry_id: entry.id, user_id: user.id, storage_path: path });
      if (ins.error) throw ins.error;
    }
    pending = []; msg("Saved ✓"); await loadDay(); msg("Saved ✓");
  } catch (e) { msg("Couldn't save: " + e.message, true); }
  $("save").disabled = false;
};

async function loadWeek() {
  const mon = mondayOf(new Date()), days = [...Array(7)].map((_, i) => { const d = new Date(mon); d.setDate(d.getDate()+i); return d; });
  const { data, error } = await sb.from("daily_entries").select("entry_date, transcript, status")
    .gte("entry_date", iso(days[0])).lte("entry_date", iso(days[6]));
  if (error) return msg(error.message, true);
  const by = Object.fromEntries((data || []).map(r => [r.entry_date, r]));
  let n = 0;
  $("weekList").innerHTML = days.map(d => {
    const r = by[iso(d)]; if (r) n++;
    const label = d.toLocaleDateString("en-AU", { weekday:"long", day:"numeric", month:"short" });
    const pill = r ? `<span class="pill ${r.status==='confirmed'?'conf':'has'}">${r.status==='confirmed'?'confirmed':'logged'}</span>` : `<span class="pill">empty</span>`;
    const snip = r && r.transcript ? r.transcript.replace(/[<>&]/g, "") : "";
    return `<div class="day${iso(d)===iso(new Date())?' today':''}" data-d="${iso(d)}"><div>${label}<small>${snip}</small></div>${pill}</div>`;
  }).join("");
  $("weekTotals").textContent = `${n} of 7 days logged`;
  document.querySelectorAll(".day").forEach(el => el.onclick = () => { $("date").value = el.dataset.d; show("today"); loadDay(); });
}

boot();
</script>
